<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Журнал старосты</title>
<style>
:root{--g1:#f3f4f6;--g2:#e5e7eb;--g3:#9ca3af;--dk:#374151;--tx:#111827;--mt:#6b7280}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fff;color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--g2);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:18px;margin:0}
#chip{font:inherit;font-size:12px;color:var(--mt);background:var(--g1);padding:5px 10px;border:0;border-radius:99px}
#chip.err{color:#fff;background:var(--dk)}
main{max-width:560px;margin:0 auto;padding:12px 16px}
.hd2{font-size:15px;color:var(--mt);margin:4px 0 12px;text-transform:capitalize}
.card{background:var(--g1);border-radius:14px;padding:12px;margin:0 0 12px}
.ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.muted{color:var(--mt)}.pad{padding:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--g2)}
.seg{display:flex;gap:4px;flex-shrink:0}
.seg button,.btn,.x{font:inherit;border:0;border-radius:10px;background:#fff;color:var(--tx);min-height:40px;padding:0 12px}
.seg button{min-width:52px;font-size:14px}
.seg button.on,.btn.pri{background:var(--dk);color:#fff}
.tag{font-size:14px;color:var(--mt)}.tag.p{color:var(--tx);font-weight:600}.tag.a{color:var(--dk);text-decoration:underline}
.acts{display:flex;gap:8px;margin:6px 0 4px;flex-wrap:wrap}
.x{min-width:40px;padding:0;font-size:20px;color:var(--mt)}
.form{display:grid;gap:8px;margin-top:10px}
input,select,textarea{font:inherit;width:100%;min-height:44px;border:1px solid var(--g2);border-radius:10px;padding:8px 12px;background:#fff;color:var(--tx)}
textarea{min-height:90px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--g2);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;font:inherit;font-size:13px;border:0;background:none;color:var(--mt);padding:14px 0}
.tabs button.on{color:var(--tx);font-weight:700;box-shadow:inset 0 2px 0 var(--dk)}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px 4px;border-top:1px solid var(--g2);text-align:left}th{border:0;color:var(--mt);font-weight:500}
td:nth-child(n+2),th:nth-child(n+2){text-align:center}
small{font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--dk);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><h1 id="gname">Журнал</h1><button id="chip">…</button></header>
<main id="view"><div class="card muted">Загрузка…</div></main>
<nav class="tabs">
<button data-tab="today">Сегодня</button><button data-tab="journal">Журнал</button><button data-tab="totals">Итоги</button><button data-tab="group">Группа</button>
</nav>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
const z=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const parse=s=>new Date(s+'T00:00:00');
const fmt=s=>parse(s).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const L={p:'Тут',a:'Нет',e:'Ув.'};
const DAYS=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const WL={all:'',num:' · над чертой',den:' · под чертой'};
const WNAME={num:'над чертой',den:'под чертой'};
const timeRange=p=>{const t=p.time||'';return p.end?t+' — '+p.end:t};
const host=location.hostname;
const cfg={owner:host.endsWith('.github.io')?host.split('.')[0]:'gdenikita',repo:(host.endsWith('.github.io')&&location.pathname.split('/')[1])||'zhurnal-starosty'};
const API=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data.json`;
const DEF=()=>({group:'Моя группа',anchor:null,students:[],schedule:[],marks:{},deadlines:[],nid:1});
let D=DEF(),sha=null,token='',tab='today',jdate=iso(new Date()),dirty=false,saving=false,err=false,stat='Загрузка…',tm=null;
try{token=localStorage.getItem('zs_token')||''}catch(e){}
const isEd=()=>!!token;
const b64=s=>{const u=new TextEncoder().encode(s);let b='';for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(b)};
const utf8=b=>{const s=atob(b.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(s,c=>c.charCodeAt(0)))};
const hdr=()=>Object.assign({Accept:'application/vnd.github+json'},token?{Authorization:'Bearer '+token}:{});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function setStat(t,e){stat=t;err=!!e;chip()}
function chip(){const c=$('#chip');c.textContent=(isEd()?'Староста · ':'Просмотр · ')+stat;c.className=err?'err':''}
function weekType(ds){
  if(!D.anchor)return null;
  const d=parse(ds);
  const effective=new Date(d);
  if(d.getDay()===0)effective.setDate(d.getDate()+1);
  const mon=new Date(effective);mon.setDate(effective.getDate()-((effective.getDay()+6)%7));
  const w=Math.round((mon-parse(D.anchor))/604800000);
  return w%2===0?'num':'den';
}
function pairsFor(ds){
  const day=(parse(ds).getDay()+6)%7+1,wt=weekType(ds);
  return D.schedule.filter(p=>p.day===day&&(p.week==='all'||!wt||p.week===wt)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
}
function studyDate(base){
  const x=new Date(base);
  const day=x.getDay();
  if(day===0)x.setDate(x.getDate()+1);
  else if(day===6)x.setDate(x.getDate()+2);
  return x;
}
async function load(silent){
  if(dirty||saving)return;
  try{
    let r=await fetch(API+'?t='+Date.now(),{headers:hdr(),cache:'no-store'});
    if(r.status===401&&token){token='';try{localStorage.removeItem('zs_token')}catch(e){}toast('Токен недействителен');r=await fetch(API+'?t='+Date.now(),{headers:hdr(),cache:'no-store'})}
    let nd=null;
    if(r.ok){const j=await r.json();sha=j.sha;nd=JSON.parse(utf8(j.content))}
    else if(r.status===404||r.status===403){
      const f=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
      if(f.ok)nd=await f.json();else sha=null;
    } else throw new Error(r.status);
    nd=Object.assign(DEF(),nd||{});
    if(JSON.stringify(nd)!==JSON.stringify(D)||!silent){D=nd;if(!silent||!document.activeElement||!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()}
    setStat('Обновлено');
  }catch(e){setStat('Нет связи',true);if(!silent)render()}
}
function mut(fn){fn();dirty=true;render();clearTimeout(tm);tm=setTimeout(flush,700)}
async function flush(){
  if(!isEd()||saving||!dirty)return;
  saving=true;dirty=false;setStat('Сохраняю…');
  try{
    for(let i=0;i<2;i++){
      const body={message:'update '+new Date().toISOString(),content:b64(JSON.stringify(D,null,1))};
      if(sha)body.sha=sha;
      const r=await fetch(API,{method:'PUT',headers:hdr(),body:JSON.stringify(body)});
      if(r.ok){sha=(await r.json()).content.sha;setStat('Сохранено');break}
      if((r.status===409||r.status===422)&&i===0){
        const g=await fetch(API+'?t='+Date.now(),{headers:hdr(),cache:'no-store'});
        sha=g.ok?(await g.json()).sha:null;continue;
      }
      throw new Error(r.status);
    }
  }catch(e){dirty=true;setStat('Не сохранено — нажмите',true)}
  saving=false;
  if(dirty&&!err)flush();
}
function dayView(ds,canEdit){
  const ed=!!canEdit&&isEd(),ps=pairsFor(ds);
  if(!ps.length)return '<div class="card muted">В этот день пар нет.</div>';
  if(!canEdit){
    return ps.map(p=>`<div class="card"><div class="ph"><b>${esc(p.name)}</b><span class="muted">${esc(timeRange(p))}${WL[p.week]||''}</span></div></div>`).join('');
  }
  return ps.map(p=>{
    const m=(D.marks[ds]||{})[p.id]||{};
    let rows='';
    if(!D.students.length){
      rows='<div class="muted pad">Список группы пуст.'+(isEd()?' Добавьте студентов во вкладке «Группа».':' Войдите как староста и добавьте список.')+'</div>';
    } else {
      rows=D.students.map(s=>{
        const v=m[s.id];
        return `<div class="row"><span>${esc(s.name)}</span>`+(ed
          ?`<span class="seg">${['p','a','e'].map(k=>`<button class="${v===k?'on':''}" data-m="${ds}|${p.id}|${s.id}|${k}">${L[k]}</button>`).join('')}</span>`
          :`<span class="tag ${v||''}">${v?L[v]:'—'}</span>`)+'</div>';
      }).join('');
    }
    return `<div class="card"><div class="ph"><b>${esc(p.name)}</b><span class="muted">${esc(timeRange(p))}${WL[p.week]||''}</span></div>`
      +(ed&&D.students.length?`<div class="acts"><button class="btn" data-all="${ds}|${p.id}">Все тут</button><button class="btn pri" data-sum="${ds}|${p.id}">Сводка в чат группы</button></div>`:'')
      +rows+'</div>';
  }).join('');
}
function deadlinesView(){
  const ed=isEd(),t=iso(new Date());
  const list=[...D.deadlines].sort((a,b)=>(a.d||'9').localeCompare(b.d||'9'));
  let h='<div class="card"><b>Сроки</b>';
  if(!list.length)h+='<div class="muted pad">Пока нет</div>';
  h+=list.map(x=>`<div class="row"><span class="${x.d&&x.d<t?'muted':''}">${esc(x.t)}${x.d?`<br><small class="muted">до ${fmt(x.d)}</small>`:''}</span>${ed?`<button class="x" data-deld="${x.id}">×</button>`:''}</div>`).join('');
  if(ed)h+='<div class="form"><input id="dt" placeholder="Что сдать"><input id="dd" type="date"><button class="btn pri" id="addd">Добавить срок</button></div>';
  return h+'</div>';
}
function vToday(){
  const now=new Date();
  const study=studyDate(now);
  const ds=iso(study);
  const wt=weekType(ds);
  const t=study.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  const note=iso(now)!==ds?' · ближайший учебный день':'';
  return `<div class="hd2">${t}${wt?' · '+WNAME[wt]:''}${note}</div>`+dayView(ds,false)+deadlinesView();
}
function vJournal(){
  const ym=jdate.slice(0,7),cnt={};
  for(const d in D.marks)if(d.startsWith(ym))for(const pid in D.marks[d])for(const sid in D.marks[d][pid]){
    const v=D.marks[d][pid][sid];if(v==='p')continue;(cnt[sid]=cnt[sid]||{a:0,e:0})[v]++;
  }
  const rows=D.students.filter(s=>cnt[s.id]).map(s=>{
    const a=cnt[s.id].a||0,e=cnt[s.id].e||0;
    return `<tr><td>${esc(s.name)}</td><td>${a}</td><td>${e}</td><td>${a*2}</td></tr>`;
  }).join('');
  const mn=parse(ym+'-01').toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  const wt=weekType(jdate);
  return `<input type="date" id="jd" value="${jdate}" style="margin-bottom:8px">`
    +`<div class="hd2 muted" style="margin-bottom:12px">${parse(jdate).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}${wt?' · '+WNAME[wt]:''}</div>`
    +dayView(jdate,true)
    +`<div class="card"><b>Пропуски за ${mn}</b>`+(rows?`<table><tr><th>Студент</th><th>Нет</th><th>Ув.</th><th>Часы</th></tr>${rows}</table>`:'<div class="muted pad">Пропусков нет</div>')+'<div class="muted"><small>1 пара = 2 часа. Считаются только «Нет».</small></div></div>';
}
function vTotals(){
  const ed=isEd();
  const now=new Date();
  const ym=iso(now).slice(0,7);
  const mn=parse(ym+'-01').toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  const cnt={};
  for(const d in D.marks)if(d.startsWith(ym))for(const pid in D.marks[d])for(const sid in D.marks[d][pid]){
    const v=D.marks[d][pid][sid];if(v==='p')continue;(cnt[sid]=cnt[sid]||{a:0,e:0})[v]++;
  }
  const rows=D.students.map(s=>{
    const a=(cnt[s.id]||{}).a||0,e=(cnt[s.id]||{}).e||0;
    return `<tr><td>${esc(s.name)}</td><td>${a}</td><td>${e}</td><td><b>${a*2}</b></td></tr>`;
  }).join('');
  let totalA=0,totalE=0;
  D.students.forEach(s=>{totalA+=(cnt[s.id]||{}).a||0;totalE+=(cnt[s.id]||{}).e||0});
  const wt=weekType(iso(studyDate(now)));
  let h=`<div class="card"><b>Неделя</b><div class="muted pad">Сейчас: ${wt?WNAME[wt]:'не задано'}</div>`
    +(ed?`<div class="acts"><button class="btn" data-setw="num">Сейчас над чертой</button><button class="btn" data-setw="den">Сейчас под чертой</button></div>`:'')
    +'</div>';
  h+=`<div class="card"><b>Итоги пропусков · ${mn}</b>`
    +`<div class="muted pad"><small>Считается только текущий месяц. С 1-го числа нового месяца итоги обнуляются автоматически.</small></div>`;
  if(!D.students.length)h+='<div class="muted pad">Список группы пуст.</div>';
  else {
    h+=`<table><tr><th>Студент</th><th>Нет</th><th>Ув.</th><th>Часы</th></tr>${rows}`
      +`<tr><td><b>Всего</b></td><td><b>${totalA}</b></td><td><b>${totalE}</b></td><td><b>${totalA*2}</b></td></tr></table>`;
  }
  h+='<div class="muted"><small>1 пара «Нет» = 2 часа. Уважительные в часы не входят.</small></div></div>';
  return h;
}
function vGroup(){
  const ed=isEd();
  let h='';
  if(!ed)h+=`<div class="card"><b>Вход для старосты</b><div class="muted pad"><small>Нужен токен доступа GitHub. Без него журнал открыт только для просмотра.</small></div><div class="form"><input id="tok" type="password" placeholder="Токен GitHub" autocomplete="off"><button class="btn pri" id="login">Войти как староста</button></div></div>`;
  h+=`<div class="card"><b>Группа</b>`+(ed?`<div class="form"><input id="gn" value="${esc(D.group)}"><button class="btn" id="saveg">Сохранить название</button></div>`:`<div class="muted pad">${esc(D.group)}</div>`)+'</div>';
  h+=`<div class="card"><b>Студенты (${D.students.length})</b>`+D.students.map(s=>`<div class="row"><span>${esc(s.name)}</span>${ed?`<button class="x" data-dels="${s.id}">×</button>`:''}</div>`).join('');
  if(ed)h+='<div class="form"><textarea id="sl" placeholder="По одному в строке"></textarea><button class="btn pri" id="adds">Добавить в список</button></div>';
  h+='</div>';
  if(ed)h+='<div class="card"><b>Прочее</b><div class="acts"><button class="btn" id="dl">Скачать копию журнала</button><button class="btn" id="logout">Закрыть доступ</button></div></div>';
  return h;
}
function render(){
  $('#gname').textContent=D.group||'Журнал';
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('#view').innerHTML={today:vToday,journal:vJournal,totals:vTotals,group:vGroup}[tab]();
  chip();
}
function summary(ds,pid){
  const p=D.schedule.find(x=>x.id==pid),m=(D.marks[ds]||{})[pid]||{};
  const by=k=>D.students.filter(s=>m[s.id]===k).map(s=>s.name);
  const un=D.students.filter(s=>!m[s.id]).map(s=>s.name);
  const d=parse(ds).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  let t=`${D.group}, ${d}\nПара: ${p.name}${p.time?' ('+timeRange(p)+')':''}\nБыло: ${by('p').length} из ${D.students.length}\n`;
  if(by('a').length)t+='Нет: '+by('a').join(', ')+'\n';
  if(by('e').length)t+='Уважительная причина: '+by('e').join(', ')+'\n';
  if(un.length)t+='Не отмечены: '+un.join(', ')+'\n';
  return t.trim();
}
async function copy(t){
  try{await navigator.clipboard.writeText(t);toast('Скопировано. Вставьте в чат группы')}
  catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}a.remove();if(ok)toast('Скопировано. Вставьте в чат группы');else prompt('Скопируйте текст:',t)}
}
function mondayOf(d){const m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));return m}
async function login(){
  const t=($('#tok').value||'').trim();if(!t)return;
  try{
    const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}`,{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t}});
    const j=await r.json();
    if(r.ok&&j.permissions&&j.permissions.push){token=t;try{localStorage.setItem('zs_token',t)}catch(e){}toast('Вы вошли как староста');await load();render()}
    else toast('Токен не подходит')
  }catch(e){toast('Нет связи')}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.tab){tab=d.tab;render();scrollTo(0,0);return}
  if(b.id==='chip'){if(dirty||err)flush();else load();return}
  if(b.id==='login'){login();return}
  if(!isEd())return;
  if(d.m){const[ds,pid,sid,k]=d.m.split('|');mut(()=>{D.marks[ds]=D.marks[ds]||{};const m=D.marks[ds][pid]=D.marks[ds][pid]||{};if(m[sid]===k)delete m[sid];else m[sid]=k})}
  else if(d.all){const[ds,pid]=d.all.split('|');mut(()=>{D.marks[ds]=D.marks[ds]||{};const m=D.marks[ds][pid]=D.marks[ds][pid]||{};D.students.forEach(s=>m[s.id]='p')})}
  else if(d.sum){const[ds,pid]=d.sum.split('|');copy(summary(ds,pid))}
  else if(d.setw){mut(()=>{const mon=mondayOf(studyDate(new Date()));if(d.setw==='den')mon.setDate(mon.getDate()-7);D.anchor=iso(mon)})}
  else if(d.delp){if(confirm('Удалить пару?'))mut(()=>{D.schedule=D.schedule.filter(p=>p.id!=d.delp)})}
  else if(d.dels){if(confirm('Удалить студента из списка?'))mut(()=>{D.students=D.students.filter(s=>s.id!=d.dels)})}
  else if(d.deld){mut(()=>{D.deadlines=D.deadlines.filter(x=>x.id!=d.deld)})}
  else if(b.id==='addp'){const name=$('#pn').value.trim();if(!name)return toast('Введите предмет');const day=+$('#pd').value,time=$('#pt').value,week=$('#pw').value;mut(()=>D.schedule.push({id:D.nid++,day,time,name,week}))}
  else if(b.id==='adds'){const ns=$('#sl').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!ns.length)return;mut(()=>ns.forEach(n=>D.students.push({id:D.nid++,name:n})))}
  else if(b.id==='addd'){const t=$('#dt').value.trim();if(!t)return toast('Введите, что сдать');const dd=$('#dd').value;mut(()=>D.deadlines.push({id:D.nid++,t,d:dd||null}))}
  else if(b.id==='saveg'){const g=$('#gn').value.trim();if(g)mut(()=>{D.group=g})}
  else if(b.id==='logout'){token='';try{localStorage.removeItem('zs_token')}catch(x){}render();toast('Доступ закрыт')}
  else if(b.id==='dl'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='zhurnal-starosty.json';a.click()}
});
document.addEventListener('change',e=>{if(e.target.id==='jd'&&e.target.value){jdate=e.target.value;render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!isEd())load(true)});
setInterval(()=>{if(!document.hidden&&!isEd())load(true)},60000);
render();load();
</script>
</body>
</html>
